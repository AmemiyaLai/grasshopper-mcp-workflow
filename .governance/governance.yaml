schemaVersion: "2.0"

repository:
  id: "grasshopper-mcp-workflow"
  type: app

governance:
  level: G2
  target: G4
  riskTier: T2

branching:
  profile: production
  ciProfile: application
  branches:
    stable: main
    development: dev
    integration: { enabled: false, pattern: "integration/<version>" }
    release: { enabled: true, pattern: "release/<version>" }
    task: { issueRequired: true, patterns: ["<type>/<issue>-<description>"] }
    hotfix: { pattern: "hotfix/<version>-<description>" }

commit:
  scopeProfiles:
    - application
  scopes:
    - mcp
    - grasshopper
    - rhino
    - protocol
    - tools
    - runner
    - schema
    - workflow

extends: []

policies:
  coverage:
    enabled: true
    thresholds:
      statements: 75
      branches: 75
      functions: 75
      lines: 75
  dependency:
    enforceLockfile: true
    blockVulnerabilities:
      - high
      - critical
  license:
    policy: "commercial-permissive"
    allowed:
      - "MIT"
      - "Apache-2.0"
      - "BSD-2-Clause"
      - "BSD-3-Clause"
      - "ISC"
      - "CC0-1.0"
      - "Unlicense"
    blocked:
      - "GPL-2.0"
      - "GPL-3.0"
      - "AGPL-3.0"
      - "SSPL"

quality:
  enabled: true
  thresholds:
    minCoverage: 35
    minPassRate: 100
  audit:
    lastAuditedCommit: "c11719e"
    recordedCoverage: 95
    testPassRate: 100
    auditedAt: '2026-09-24T20:57:10Z'


